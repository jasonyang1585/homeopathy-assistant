<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>順勢療方助手｜經典草本藥典與智慧辨證查詢</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Noto Sans TC & Inter & Noto Serif TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;600;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome for clean botanical/medical icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans TC"', 'Inter', 'sans-serif'],
            serif: ['"Noto Serif TC"', 'serif'],
            mono: ['Inter', 'monospace'],
          },
          colors: {
            linen: {
              50: '#FCFBF8',
              100: '#F7F5EE',
              200: '#ECE7DA',
              300: '#DCD4C0',
            },
            sage: {
              50: '#F3F7F4',
              100: '#E3ECE6',
              200: '#C5D8CC',
              300: '#9DBCA9',
              500: '#5D876E',
              600: '#496E58',
              700: '#395746',
              800: '#2A4134',
              900: '#1D2E25',
            },
            amber: {
              50: '#FDF9F0',
              100: '#F9EED6',
              200: '#F1D9A6',
              500: '#C88D32',
              600: '#A87121',
              700: '#855617',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #F7F5EE;
      color: #1D2E25;
      overflow-x: hidden;
    }
    /* Custom subtle scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #F7F5EE;
    }
    ::-webkit-scrollbar-thumb {
      background: #C5D8CC;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #9DBCA9;
    }
    .botanical-pattern {
      background-image: radial-gradient(#C5D8CC 0.75px, transparent 0.75px), radial-gradient(#C5D8CC 0.75px, #F7F5EE 0.75px);
      background-size: 28px 28px;
      background-position: 0 0, 14px 14px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-sage-200 selection:text-sage-900">

  <!-- Top Navigation & Brand Header -->
  <header class="bg-sage-900 text-linen-50 shadow-md sticky top-0 z-40 border-b border-sage-700">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3.5 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-sage-700 border border-sage-500 flex items-center justify-center text-amber-200 shadow-inner">
          <i class="fa-solid fa-mortar-pestle text-lg"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-serif text-lg sm:text-xl font-bold tracking-wide text-linen-50">順勢療方助手</h1>
            <span class="hidden sm:inline-block text-[11px] font-medium px-2 py-0.5 rounded-full bg-sage-700 text-sage-100 border border-sage-600">
              Materia Medica & Bach System
            </span>
          </div>
          <p class="text-xs text-sage-200">經典七維度順勢辨證・藥典查詢・巴赫花精情緒平衡</p>
        </div>
      </div>

      <!-- Mode Switcher Pills & Settings -->
      <nav class="flex bg-sage-800 p-1 rounded-xl border border-sage-700 w-full sm:w-auto items-center">
        <button id="tab-symptom" onclick="switchMode('symptom')"
          class="flex-1 sm:flex-initial px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 flex items-center justify-center gap-2 bg-linen-50 text-sage-900 shadow-sm">
          <i class="fa-solid fa-stethoscope text-sage-600"></i>
          <span>症狀評估與配對</span>
        </button>
        <button id="tab-remedy" onclick="switchMode('remedy')"
          class="flex-1 sm:flex-initial px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 flex
